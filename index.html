<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rhythm Revolution | Music Banger</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="header">

        <div class="brand">
            <span class="brand-icon">♫</span>
             <span>Rhythm Revolution</span>
        </div>

        <div class="search-box">

            <input
                id="inputValue"
                class="form-control input-styling"
                type="search"
                placeholder="Find your favourite song..."
            >

            <button class="button" id="searchBtn">
                search
            </button>

        </div>

    </nav>


    <section class="hero-section">

        <div class="hero-content">

            <p class="welcome-text">YOUR MUSIC. YOUR RHYTHYM.</p>

            <h1>Where words fail, music<span> speaks.</span></h1>

            <p class="description">
                Discover the ultimate music experience with Rhythm Revolution. 
            </p>

        </div>

//codepen.io wand effect
        <div class="music-loader" id="spinner">
    <div class="wand-container">
        
        <div class="wand"></div>
        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
    </div>
    <p>Summoning your music...</p>
</div>


        <div class="container" id="container">

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
